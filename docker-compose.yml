version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: club_deportivo_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: club_deportivo
      MYSQL_USER: club_user
      MYSQL_PASSWORD: club_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

volumes:
  db_data: